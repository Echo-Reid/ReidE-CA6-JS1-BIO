<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Bear Hunter Ninja</title>
  </head>
  <body>
    <div>
      <p id="dismessage">Hello World! </p>
    </div>

    <script>
      /* getting player name and choice */
      let username = prompt('Welcome to Bear Hunter Ninja! Please enter your name to get started: ');
      alert(`Hi ${username}! Let\'s Play!!`);
      let playerChoice = prompt('Who are you: Bear, Ninja, or Hunter?');
      console.log(`${username}, You picked ${playerChoice}!`);

      /*Deciding the computer's choice*/
      let computerChoice = "Bear";
      console.log(`The computer picked ${computerChoice}!`);

      /*rewriting the webpage to display results*/
      document.getElementById("dismessage").innerHTML = `${username}, You picked ${playerChoice}!<br>The computer picked ${computerChoice}!`;
    </script>

    <div>
      <hr>
      <p style="text-align: right;">This page created as academic activity only.</p>
    </div>
  </body>
</html>
